# GitHub Pages deployment workflow - Jekyll
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll (Bundler)
        run: |
          gem install bundler
          bundle config set deployment 'true'
          bundle install --jobs 4 --retry 3
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke Test (post-deploy)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to propagate
        run: sleep 90

      - name: Run SEO / analytics checks
        run: |
          BASE="https://e8guide.com"
          PASS=0; FAIL=0

          check() {
            local label="$1" url="$2" pattern="$3"
            local body
            body=$(curl -s --max-time 15 "$url")
            if echo "$body" | grep -q "$pattern"; then
              echo "✅  $label"
              PASS=$((PASS+1))
            else
              echo "❌  $label  (url: $url)"
              FAIL=$((FAIL+1))
            fi
          }

          echo "── Homepage checks ─────────────────────────────────"
          check "GA4 tag present"            "$BASE/"                  "G-542SSSJ56F"
          check "gtag.js loaded"             "$BASE/"                  "googletagmanager.com/gtag/js"
          check "GSC verification meta"      "$BASE/"                  "google-site-verification"
          check "meta description"           "$BASE/"                  'name="description"'
          check "canonical link"             "$BASE/"                  'rel="canonical"'
          check "Open Graph title"           "$BASE/"                  "og:title"
          check "Twitter card"               "$BASE/"                  "twitter:card"
          check "SVG data URI favicon"       "$BASE/"                  "data:image/svg"

          echo ""
          echo "── Control page checks ─────────────────────────────"
          check "GA4 on control page"        "$BASE/controls/ISM-0843.html"  "G-542SSSJ56F"
          check "Canonical on control page"  "$BASE/controls/ISM-0843.html"  'rel="canonical"'
          check "JSON-LD structured data"    "$BASE/controls/ISM-0843.html"  "application/ld+json"
          check "meta description (control)" "$BASE/controls/ISM-0843.html"  'name="description"'

          echo ""
          echo "── Ancillary files ─────────────────────────────────"
          check "sitemap.xml accessible"          "$BASE/sitemap.xml"       "<sitemapindex"
          check "sitemap-1.xml accessible"        "$BASE/sitemap-1.xml"     "<urlset"
          check "robots.txt accessible"           "$BASE/robots.txt"        "Sitemap:"
          check "security.txt accessible"         "$BASE/.well-known/security.txt"  "Contact:"
          check "feed.xml accessible"             "$BASE/feed.xml"          "<feed"
          check "404 page accessible"             "$BASE/404.html"          "404"
          check "GSC verification file served"    "$BASE/google010e8f920b8d5758.html" "google-site-verification"

          echo ""
          echo "── Results: $PASS passed, $FAIL failed ─────────────"
          [ "$FAIL" -eq 0 ] || exit 1
