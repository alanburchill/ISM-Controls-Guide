name: Add missing permalinks

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # nightly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-permalinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run permalinks script (dry-run)
        run: |
          python scripts/add_permalinks.py --path controls --dry-run

      - name: Run permalinks script
        run: |
          python scripts/add_permalinks.py --path controls --update-site-index

      - name: Create pull request if changes
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: add missing permalink front matter to row-* files"
          title: "chore: add missing permalinks"
          branch: add-permalinks/auto
          labels: automated, housekeeping
          body: "This PR adds missing `permalink` front matter to `row-*` files and optionally updates `_data/site_index.yml`."
