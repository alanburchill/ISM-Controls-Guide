name: Generate /ask JSON

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run /ask generator
        run: |
          python scripts/generate_ask_json.py

      - name: Show generated files
        run: |
          echo "Files in ask/" && ls -la ask || true

      - name: Commit generated /ask JSON (on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ask || true
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: regenerate /ask JSON (generated by workflow)"
            git push
          fi

      - name: Ping IndexNow for /ask URLs (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.INDEXNOW_KEY != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          KEY="$INDEXNOW_KEY"
          KEY_FILE_URL="https://e8guide.com/${KEY}.txt"
          echo "IndexNow key configured — pinging IndexNow for /ask URLs"
          jq -r '.[].url' ask/index.json | sed 's#^/#https://e8guide.com/#' | while read -r u; do
            echo "Pinging: $u"
            curl -sS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" -d "{\"host\":\"e8guide.com\",\"key\":\"$KEY\",\"keyLocation\":\"$KEY_FILE_URL\",\"urlList\":[\"$u\"]}"
            echo
          done || true

      - name: Upload ask JSON as PR artifact (preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ask-json
          path: ask/