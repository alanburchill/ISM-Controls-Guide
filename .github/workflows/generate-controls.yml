name: Generate controls from row files

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run generator script
        run: |
          python scripts/generate_controls_from_rows.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add controls/*.md
            git commit -m "chore: generate controls from row files [skip ci]" || echo "No changes to commit"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
