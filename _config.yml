# Jekyll configuration for Essential 8 Guide
# Website: https://e8guide.com

title: "Essential 8 Guide"
description: "Implementation guidance for Australian Essential Eight controls in Microsoft environments - ISM controls with PSPF mappings"
baseurl: ""
url: "https://e8guide.com"

# Site settings
github:
  repository_url: "https://github.com/alanburchill/ISM-Controls-Guide"

# Defaults for markdown files
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "controls"
    values:
      layout: "control"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "&#8617;"

# Exclude files from build
exclude:
  - controls-html
  - scripts
  - "*.code-workspace"
  - README.md

# Include these folders
include:
  - controls
  - _data
  - assets

# Plugins
plugins:
  - jekyll-last-modified-at
  - jekyll-feed

# ── Google / SEO ──────────────────────────────────────────────────────────────
# Google Analytics 4 Measurement ID  (e.g. G-XXXXXXXXXX)
# Leave blank to disable GA tracking.
google_analytics: "G-542SSSJ56F"

# Google Search Console ownership verification token
# Found in: Search Console → Settings → Ownership verification → HTML tag
# Copy only the content="…" value (without the surrounding quotes).
google_site_verification: "010e8f920b8d5758"

# ── Jekyll Feed (RSS/Atom) ─────────────────────────────────────────────────────
feed:
  path: feed.xml
